services:
  go2rtc:
    image: alexxit/go2rtc
    network_mode: host
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    restart: unless-stopped

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_HTTP_PORT: "8082"
      TELEGRAM_LOCAL: "true"
    ports:
      - "8082:8082"
    volumes:
      - telegram-bot-api-data:/data
    restart: unless-stopped

  kodi-training:
    container_name: kodi-training
    image: ghcr.io/db-ai-utils/koditraining:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    network_mode: host
    depends_on:
      - go2rtc
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./thumbnails:/app/thumbnails
      - ./recordings:/app/recordings
      - ./auto-record-config.json:/app/auto-record-config.json
    environment:
      PORT: "8086"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: eu-north-1
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ECS_CLUSTER: ${AWS_ECS_CLUSTER}
      AWS_ECS_TASK_DEFINITION: ${AWS_ECS_TASK_DEFINITION}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_API_URL: http://localhost:8082
      RTSP_BASE: rtsp://localhost:8554
      GO2RTC_API: http://localhost:1984
      RECORDINGS_DIR: ./recordings
    restart: unless-stopped

volumes:
  telegram-bot-api-data:
