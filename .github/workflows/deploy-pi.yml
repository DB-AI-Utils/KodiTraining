name: Deploy to Pi

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (commit SHA). Leave empty to build from current code."
        required: false

concurrency:
  group: deploy-pi
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: inputs.image_tag == ''
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: image
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: Dockerfile.app
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate image tag
        if: inputs.image_tag != ''
        run: |
          if ! echo "${{ inputs.image_tag }}" | grep -qE '^[a-f0-9]{7,40}$'; then
            echo "::error::Invalid image_tag: must be a 7-40 character hex string (commit SHA)"
            exit 1
          fi

      - name: Determine image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          IMAGE_NAME="${IMAGE,,}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/do_key
          echo "${{ secrets.PI_SSH_PRIVATE_KEY }}" > ~/.ssh/pi_key
          chmod 600 ~/.ssh/do_key ~/.ssh/pi_key
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config << 'SSHEOF'
          Host do-jump
            HostName ${{ vars.DO_HOST }}
            User ${{ vars.DO_USER }}
            IdentityFile ~/.ssh/do_key
            IdentitiesOnly yes

          Host pi
            HostName ${{ vars.PI_HOST }}
            Port ${{ vars.PI_PORT }}
            User ${{ vars.PI_USER }}
            IdentityFile ~/.ssh/pi_key
            IdentitiesOnly yes
            ProxyJump do-jump
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: Sync compose file to Pi
        run: scp docker-compose.pi.yml pi:~/KodiTraining/docker-compose.pi.yml

      - name: Deploy
        run: |
          ssh pi /bin/bash <<DEPLOY
          set -euo pipefail
          cd ~/KodiTraining
          export IMAGE_TAG=${{ steps.tag.outputs.tag }}
          echo "=== Pulling image: ${{ steps.tag.outputs.image }}:\${IMAGE_TAG} ==="
          docker compose -f docker-compose.pi.yml pull kodi-training
          echo "=== Recreating kodi-training ==="
          docker compose -f docker-compose.pi.yml up -d kodi-training
          echo "=== Cleaning old images ==="
          docker image prune -f
          echo "=== Deploy complete ==="
          docker ps --filter name=kodi-training --format "table {{.Image}}\t{{.Status}}"
          DEPLOY
